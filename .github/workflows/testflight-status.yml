name: TestFlight durumu

# App Store Connect'teki son ClinicApp derlemelerini ve işleme durumlarını listeler (yalnız okur, bir şey değiştirmez).
on:
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - name: Derlemeleri listele
        run: |
          pip install -q "pyjwt[crypto]"
          key="$RUNNER_TEMP/key.p8"
          body=$(printf '%s' "$ASC_KEY_P8" | sed 's/\\n/\n/g' | tr -d '\r' | sed -E 's/-----(BEGIN|END) [A-Z ]*KEY-----//g' | tr -d ' \t\n')
          { echo "-----BEGIN PRIVATE KEY-----"; printf '%s' "$body" | fold -w 64; echo; echo "-----END PRIVATE KEY-----"; } > "$key"
          python3 tools/ci/asc_builds.py "$key" com.clinicapp.uzman
          rm -f "$key"
