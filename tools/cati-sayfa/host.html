<title>Moyo Ekosistem Seçenekleri</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Düzen: tek ekranlık gezgin. Üstte iki sayfa sekmesi ve ekran boyu seçimi, altında sayfanın kendisi. */
:root {
  --bg: #EEEDF3; --panel: #FFFFFF; --ink: #16113A; --muted: #5C5875; --line: #DEDCE6; --accent: #16113A; --on-accent: #FFFFFF; --bezel: #16113A;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0E0B26; --panel: #19153D; --ink: #F2F1F8; --muted: #A2A0B8; --line: #2F2A5A; --accent: #CFCBF5; --on-accent: #16113A; --bezel: #3A3570; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #0E0B26; --panel: #19153D; --ink: #F2F1F8; --muted: #A2A0B8; --line: #2F2A5A; --accent: #CFCBF5; --on-accent: #16113A; --bezel: #3A3570; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; display: flex; flex-direction: column; }
.bar { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--panel); border-bottom: 1px solid var(--line); }
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--bg); }
.seg button { min-height: 36px; padding: 0 14px; border: 0; border-radius: 999px; background: transparent; color: var(--muted); font: inherit; font-weight: 700; cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.not { margin: 0 0 0 auto; font-size: 13px; color: var(--muted); max-width: 46ch; text-align: right; }
.sahne { flex: 1 1 auto; min-height: 0; display: grid; place-items: center; padding: 0; }
.sahne.dar { padding: 14px 0; overflow: auto; }
.cerceve { width: 100%; height: 100%; background: #FFFFFF; }
.sahne.dar .cerceve { width: var(--w); height: min(var(--h), 100%); border: 9px solid var(--bezel); border-radius: 34px; overflow: hidden; }
iframe { width: 100%; height: 100%; border: 0; display: block; }
@media (max-width: 720px) { .not { display: none; } .boy { display: none; } }
</style>
<div class="bar">
  <div class="seg" role="group" aria-label="Sayfa">
    <button type="button" id="s-c" data-sayfa="c.html" aria-pressed="true">Moyo Ekosistem</button>
    <button type="button" id="s-e" data-sayfa="ebeveyn.html" aria-pressed="false">Moyo Ebeveyn</button>
  </div>
  <div class="seg boy" role="group" aria-label="Ekran boyu">
    <button type="button" id="b-m" data-boy="masa" aria-pressed="true">Masaüstü</button>
    <button type="button" id="b-t" data-boy="tablet" aria-pressed="false">Tablet</button>
    <button type="button" id="b-p" data-boy="tel" aria-pressed="false">Telefon</button>
  </div>
  <p class="not">17 Kasım sürümü. Yayında değil; onayınızla canlıya alınır.</p>
</div>
<div class="sahne" id="sahne"><div class="cerceve"><iframe id="sayfa" title="Sayfa önizlemesi" src="c.html"></iframe></div></div>
<script>
(function () {
  var f = document.getElementById('sayfa'), s = document.getElementById('sahne'), BOY = { tablet: [820, 1180], tel: [390, 844] };
  function bas(grup, b) { [].forEach.call(grup.querySelectorAll('button'), function (x) { x.setAttribute('aria-pressed', String(x === b)); }); }
  document.querySelector('.bar').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return; bas(b.parentNode, b);
    if (b.dataset.sayfa) f.src = b.dataset.sayfa;
    if (b.dataset.boy) { var d = BOY[b.dataset.boy]; s.classList.toggle('dar', !!d); if (d) { s.style.setProperty('--w', d[0] + 18 + 'px'); s.style.setProperty('--h', d[1] + 18 + 'px'); } }
  });
})();
</script>
