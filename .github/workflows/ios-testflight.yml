name: iOS (TestFlight)

# ClinicApp (uzman paneli, iPad + iPhone) → macOS'ta expo prebuild + xcodebuild → TestFlight.
# İmza: tools/ci/asc_sign.py (geçici App Store dağıtım sertifikası + profil; geliştirme sertifikası oluşmaz). Gerekli secret'lar: docs/TESTFLIGHT.md
# Elle: Actions → "iOS (TestFlight)" → Run workflow. Otomatik: main'e gelen commit mesajında [ios] geçerse.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Mac makinesi (macos-15 = Apple işlemci; kuyrukta kalırsa macos-15-intel)"
        type: choice
        options: [macos-15, macos-15-intel]
        default: macos-15
  push:
    branches: [main]

concurrency:
  group: clinicapp-ios
  cancel-in-progress: false

jobs:
  testflight:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ios]')
    # GitHub'da Apple işlemcili (arm64) Mac kapasitesi dolunca iş 15 dk sonra "not acquired" ile düşer (2 Kasım 2026, çalışma 88;
    # ParentApp'te de); o zaman elle başlatmada macos-15-intel seçilir.
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 120
    env:
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # İsteğe bağlı: RevenueCat herkese açık iOS anahtarı (appl_…; ortak CANLIYA_ALMA 1.8). Yoksa üyelik satın alınamaz.
      REVENUECAT_IOS_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_IOS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Secret denetimi
        run: |
          miss=""
          for v in SUPABASE_PUBLISHABLE_KEY ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            [ -z "${!v}" ] && miss="$miss $v"
          done
          if [ -n "$miss" ]; then echo "::error::Eksik secret:$miss (docs/TESTFLIGHT.md)"; exit 1; fi
          case "$SUPABASE_PUBLISHABLE_KEY" in sb_secret_*) echo "::error::SUPABASE_PUBLISHABLE_KEY gizli anahtar; publishable anahtarı yaz."; exit 1;; esac
          case "$REVENUECAT_IOS_KEY" in
            "") echo "::warning::EXPO_PUBLIC_REVENUECAT_IOS_KEY yok: bu derlemede App Store üyeliği kapalı." ;;
            appl_*) echo "RevenueCat iOS anahtarı var." ;;
            *) echo "::error::EXPO_PUBLIC_REVENUECAT_IOS_KEY appl_ ile başlamalı (RevenueCat › API keys › ClinicApp herkese açık anahtarı). sk_ gizli anahtarı asla."; exit 1 ;;
          esac
      - run: npm ci
      - name: Yerel paket sürümleri tek mi
        run: node tools/ci/check-native-dupes.js
      - name: Typecheck ve testler
        run: |
          npx tsc --noEmit
          npm test
      - name: Sunucu ayarı (.env)
        run: printf 'EXPO_PUBLIC_SUPABASE_URL=https://uhelhxqgpcjemadhsifx.supabase.co\nEXPO_PUBLIC_SUPABASE_KEY=%s\nEXPO_PUBLIC_REVENUECAT_IOS_KEY=%s\n' "$SUPABASE_PUBLISHABLE_KEY" "$REVENUECAT_IOS_KEY" > .env
      - name: Derle, imzala, TestFlight'a yükle
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          # .env'e ek olarak ortam değişkeni: Xcode'un JS paketleme adımı .env'i okumasa da değer pakete girer
          EXPO_PUBLIC_REVENUECAT_IOS_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_IOS_KEY }}
        run: bash tools/ci/ios-testflight.sh
