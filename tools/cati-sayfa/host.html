<title>Moyo Ekosistem Seçenekleri</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Düzen: tek ekranlık gezgin. Üstte sayfa sekmeleri, ekran boyu ve "Alternatifler" düğmesi; altında sayfanın kendisi.
   Alternatifler paneli sayfanın bildirdiği grupları (oniz.js sözleşmesi) listeler; seçim sayfada yerinde değişir. */
:root {
  --bg: #EEEDF3; --panel: #FFFFFF; --ink: #16113A; --muted: #5C5875; --line: #DEDCE6; --accent: #16113A; --on-accent: #FFFFFF; --bezel: #16113A;
  --tag: #E3F7EA; --tag-ink: #0B6B33; --shadow: 0 18px 50px rgba(22, 17, 58, .22);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0E0B26; --panel: #19153D; --ink: #F2F1F8; --muted: #A2A0B8; --line: #2F2A5A; --accent: #CFCBF5; --on-accent: #16113A; --bezel: #3A3570; --tag: #123B25; --tag-ink: #8CE5AE; --shadow: 0 18px 50px rgba(0, 0, 0, .55); color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #0E0B26; --panel: #19153D; --ink: #F2F1F8; --muted: #A2A0B8; --line: #2F2A5A; --accent: #CFCBF5; --on-accent: #16113A; --bezel: #3A3570; --tag: #123B25; --tag-ink: #8CE5AE; --shadow: 0 18px 50px rgba(0, 0, 0, .55); color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; display: flex; flex-direction: column; }
.bar { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--panel); border-bottom: 1px solid var(--line); }
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--bg); max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { min-height: 36px; padding: 0 14px; border: 0; border-radius: 999px; background: transparent; color: var(--muted); font: inherit; font-weight: 700; cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.alt-ac { min-height: 42px; margin-left: auto; padding: 0 16px; border: 1.5px solid var(--accent); border-radius: 999px; background: transparent; color: var(--ink); font: inherit; font-weight: 700; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; }
.alt-ac[aria-expanded="true"] { background: var(--accent); color: var(--on-accent); }
.alt-ac b { min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: var(--tag); color: var(--tag-ink); font-size: 12.5px; display: inline-grid; place-items: center; }
.alt-ac[hidden] { display: none; }
.orta { position: relative; flex: 1 1 auto; min-height: 0; display: flex; }
.sahne { flex: 1 1 auto; min-width: 0; min-height: 0; display: grid; place-items: center; padding: 0; }
.sahne.dar { padding: 14px 0; overflow: auto; }
.cerceve { width: 100%; height: 100%; background: #FFFFFF; }
.sahne.dar .cerceve { width: var(--w); height: min(var(--h), 100%); border: 9px solid var(--bezel); border-radius: 34px; overflow: hidden; }
iframe { width: 100%; height: 100%; border: 0; display: block; }
.panel { position: absolute; z-index: 5; top: 10px; right: max(10px, env(safe-area-inset-right, 0px)); bottom: 10px; width: min(348px, calc(100% - 20px)); display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
.panel[hidden] { display: none; }
.p-bas { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 12px 8px 16px; }
.p-bas h2 { margin: 0; font-size: 16px; }
.p-kapat { width: 36px; height: 36px; border: 0; border-radius: 50%; background: var(--bg); color: var(--ink); font: inherit; font-size: 20px; line-height: 1; cursor: pointer; }
.p-not { flex: none; margin: 0; padding: 0 16px 10px; font-size: 13px; line-height: 1.45; color: var(--muted); }
.p-liste { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 2px 12px 8px; overscroll-behavior: contain; }
.grup { margin: 0 0 10px; padding: 10px 10px 8px; border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
.grup legend { padding: 0 6px; font-size: 13px; font-weight: 700; }
.grup.secili { border-color: var(--accent); }
.sec { display: flex; flex-direction: column; gap: 4px; }
.sec button { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 38px; padding: 6px 10px; border: 1px solid transparent; border-radius: 9px; background: var(--bg); color: var(--ink); font: inherit; font-size: 13.5px; text-align: left; cursor: pointer; }
.sec button i { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--muted); display: grid; place-items: center; font-style: normal; font-size: 11.5px; font-weight: 700; text-transform: uppercase; color: var(--muted); }
.sec button span { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.sec button em { flex: none; padding: 2px 7px; border-radius: 999px; background: var(--tag); color: var(--tag-ink); font-style: normal; font-size: 11.5px; font-weight: 700; }
.sec button[aria-pressed="true"] { border-color: var(--accent); background: transparent; font-weight: 700; }
.sec button[aria-pressed="true"] i { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.p-alt { flex: none; display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); }
.p-alt button { flex: 1 1 0; min-height: 40px; padding: 0 10px; border-radius: 999px; border: 1.5px solid var(--accent); background: transparent; color: var(--ink); font: inherit; font-size: 13.5px; font-weight: 700; cursor: pointer; }
.p-alt button.dolu { background: var(--accent); color: var(--on-accent); }
.p-ozet { flex: none; margin: 0; padding: 0 12px 12px; }
.p-ozet[hidden] { display: none; }
.p-ozet textarea { display: block; width: 100%; height: 116px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); font: inherit; font-size: 12.5px; line-height: 1.4; resize: vertical; }
.p-ozet small { display: block; margin-top: 6px; font-size: 12.5px; color: var(--muted); }
@media (max-width: 720px) {
  .boy { display: none; }
  .panel { top: auto; left: 8px; right: 8px; bottom: max(8px, env(safe-area-inset-bottom, 0px)); width: auto; max-height: 52%; }
  .alt-ac { margin-left: 0; }
}
</style>
<div class="bar">
  <div class="seg" role="group" aria-label="Sayfa">
    <button type="button" data-sayfa="c.html" aria-pressed="true">Moyo Ekosistem</button>
    <button type="button" data-sayfa="ebeveyn.html" aria-pressed="false">Moyo Ebeveyn</button>
    <button type="button" data-sayfa="ebeveyn-fiyat.html" aria-pressed="false">Fiyat</button>
    <button type="button" data-sayfa="hakkimizda.html" aria-pressed="false">Hakkımızda</button>
    <button type="button" data-sayfa="guven.html" aria-pressed="false">Güvenlik</button>
  </div>
  <div class="seg boy" role="group" aria-label="Ekran boyu">
    <button type="button" data-boy="masa" aria-pressed="true">Masaüstü</button>
    <button type="button" data-boy="tablet" aria-pressed="false">Tablet</button>
    <button type="button" data-boy="tel" aria-pressed="false">Telefon</button>
  </div>
  <button type="button" class="alt-ac" id="alt-ac" aria-expanded="false" aria-controls="alt-panel" hidden>Alternatifler <b id="alt-say">0</b></button>
</div>
<div class="orta">
  <div class="sahne" id="sahne"><div class="cerceve"><iframe id="sayfa" title="Sayfa önizlemesi" src="c.html"></iframe></div></div>
  <aside class="panel" id="alt-panel" aria-label="Alternatifler" hidden>
    <div class="p-bas"><h2>Alternatifler</h2><button type="button" class="p-kapat" id="alt-kapat" aria-label="Paneli kapat">×</button></div>
    <p class="p-not">Bir seçeneğe dokunun: sayfa o bölüme gider, seçenek yerinde değişir. Yeşil etiket benim önerim. 19 Kasım, ikinci tur; yayında değil.</p>
    <div class="p-liste" id="alt-liste"></div>
    <div class="p-alt"><button type="button" id="alt-sifirla">Önerilere dön</button><button type="button" class="dolu" id="alt-kopya">Seçimlerimi kopyala</button></div>
    <div class="p-ozet" id="alt-ozet" hidden><textarea id="alt-metin" readonly aria-label="Seçimlerinizin özeti"></textarea><small id="alt-durum" aria-live="polite"></small></div>
  </aside>
</div>
<script>
(function () {
  var f = document.getElementById('sayfa'), s = document.getElementById('sahne'), BOY = { tablet: [820, 1180], tel: [390, 844] };
  var ac = document.getElementById('alt-ac'), panel = document.getElementById('alt-panel'), liste = document.getElementById('alt-liste');
  var ozet = document.getElementById('alt-ozet'), metin = document.getElementById('alt-metin'), durumYazi = document.getElementById('alt-durum');
  var sayfaDugme = [].slice.call(document.querySelectorAll('[data-sayfa]')), ANAHTAR = 'moyo.oniz.v2', secim = {}, gruplar = [], simdi = 'c.html';
  try { secim = JSON.parse(localStorage.getItem(ANAHTAR) || '{}') || {}; } catch (e) { secim = {}; }
  function sakla() { try { localStorage.setItem(ANAHTAR, JSON.stringify(secim)); } catch (e) {} }
  function bas(grup, b) { [].forEach.call(grup.querySelectorAll('button'), function (x) { x.setAttribute('aria-pressed', String(x === b)); }); }
  function pencere() { try { return f.contentWindow; } catch (e) { return null; } }
  function sayfaAdi(yol) { var b = sayfaDugme.filter(function (x) { return x.dataset.sayfa === yol; })[0]; return b ? b.textContent : yol; }
  function gecerli(g, v) { return !!v && g.sec.some(function (o) { return o[0] === v; }); }
  function secili(g) { var v = (secim[simdi] || {})[g.k]; return gecerli(g, v) ? v : g.oneri; }

  document.querySelector('.bar').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.sayfa) { bas(b.parentNode, b); f.src = b.dataset.sayfa; }
    if (b.dataset.boy) {
      bas(b.parentNode, b); var d = BOY[b.dataset.boy]; s.classList.toggle('dar', !!d);
      if (d) { s.style.setProperty('--w', d[0] + 18 + 'px'); s.style.setProperty('--h', d[1] + 18 + 'px'); }
    }
  });

  function ciz() {
    liste.textContent = '';
    gruplar.forEach(function (g) {
      var fs = document.createElement('fieldset'), lg = document.createElement('legend'), kutu = document.createElement('div');
      fs.className = 'grup'; lg.textContent = g.ad; kutu.className = 'sec'; fs.appendChild(lg); fs.appendChild(kutu);
      g.sec.forEach(function (o) {
        var b = document.createElement('button'), i = document.createElement('i'), sp = document.createElement('span');
        b.type = 'button'; b.setAttribute('aria-pressed', String(secili(g) === o[0])); i.textContent = o[0]; sp.textContent = o[1];
        b.appendChild(i); b.appendChild(sp);
        if (o[0] === g.oneri) { var em = document.createElement('em'); em.textContent = 'öneri'; b.appendChild(em); }
        b.addEventListener('click', function () { sec(g, o[0]); bas(kutu, b); });
        kutu.appendChild(b);
      });
      liste.appendChild(fs);
    });
  }
  function sec(g, v) {
    var w = pencere(); if (!w || !w.onizSec) return;
    (secim[simdi] = secim[simdi] || {})[g.k] = v; sakla();
    w.onizSec(g.k, v);
    try { var h = g.hedef && w.document.querySelector(g.hedef); if (h) h.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {}
    ozet.hidden = true;
  }
  f.addEventListener('load', function () {
    var w = pencere(), yol = 'c.html';
    try { yol = (w.location.pathname.split('/').pop() || 'c.html'); } catch (e) {}
    simdi = yol; gruplar = (w && w.onizGruplar) || [];
    sayfaDugme.forEach(function (x) { x.setAttribute('aria-pressed', String(x.dataset.sayfa === yol)); });
    gruplar.forEach(function (g) { var v = (secim[simdi] || {})[g.k]; if (gecerli(g, v) && v !== g.oneri && w.onizSec) w.onizSec(g.k, v); });
    ac.hidden = !gruplar.length; document.getElementById('alt-say').textContent = gruplar.length;
    if (!gruplar.length) kapat(); else ciz();
    ozet.hidden = true;
  });
  function kapat() { panel.hidden = true; ac.setAttribute('aria-expanded', 'false'); }
  ac.addEventListener('click', function () { var acik = panel.hidden; panel.hidden = !acik; ac.setAttribute('aria-expanded', String(acik)); });
  document.getElementById('alt-kapat').addEventListener('click', function () { kapat(); ac.focus(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !panel.hidden) { kapat(); ac.focus(); } });
  document.getElementById('alt-sifirla').addEventListener('click', function () {
    var w = pencere(); delete secim[simdi]; sakla();
    gruplar.forEach(function (g) { if (w && w.onizSec) w.onizSec(g.k, g.oneri); });
    ciz(); ozet.hidden = true;
  });
  document.getElementById('alt-kopya').addEventListener('click', function () {
    var satir = [sayfaAdi(simdi) + ' sayfası seçimlerim:'];
    gruplar.forEach(function (g) {
      var v = secili(g), o = g.sec.filter(function (x) { return x[0] === v; })[0] || g.sec[0];
      satir.push('- ' + g.ad + ': ' + v.toUpperCase() + ' (' + o[1] + ')' + (v === g.oneri ? '' : ' [önerilen ' + g.oneri.toUpperCase() + ' yerine]'));
    });
    metin.value = satir.join('\n'); ozet.hidden = false; metin.focus(); metin.select();
    var tamam = function () { durumYazi.textContent = 'Kopyalandı. Sohbete yapıştırmanız yeterli.'; };
    var elle = function () { durumYazi.textContent = 'Metin seçili; kopyalayıp sohbete yapıştırın.'; };
    try { navigator.clipboard.writeText(metin.value).then(tamam, elle); } catch (e) { elle(); }
  });
})();
</script>
